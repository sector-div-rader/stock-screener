<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股 MACD 背離與成交量監控看板</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sort-icon {
            font-size: 0.8rem;
            margin-left: 4px;
            color: #9ca3af;
        }
        .active-sort {
            color: #2563eb;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- 頂部導航列 -->
    <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-chart-line text-blue-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">美股 MACD 背離與量價監控</h1>
            </div>
            <div class="text-xs md:text-sm text-gray-400 mt-2 sm:mt-0">
                更新時間：<span id="last-updated-time" class="text-gray-200 font-mono">載入中...</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- 數據統計與狀態卡片 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between">
                <span class="text-gray-500 text-xs font-semibold uppercase">掃描總股票數</span>
                <div class="text-2xl font-bold text-gray-800 mt-1" id="stat-total">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between">
                <span class="text-gray-500 text-xs font-semibold uppercase">成功解析數量</span>
                <div class="text-2xl font-bold text-emerald-600 mt-1" id="stat-success">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between">
                <span class="text-gray-500 text-xs font-semibold uppercase">篩選出關注標的</span>
                <div class="text-2xl font-bold text-blue-600 mt-1" id="stat-matched">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between">
                <span class="text-gray-500 text-xs font-semibold uppercase">符合黃金策略標的</span>
                <div class="text-2xl font-bold text-purple-600 mt-1" id="stat-strategy">0</div>
            </div>
        </div>

        <!-- 篩選與搜尋工具列 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                <!-- 搜尋框 -->
                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="search-input" placeholder="搜尋代號 (例如 NVDA)" 
                           class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                           oninput="onSearchOrFilterChange()">
                </div>

                <!-- 策略快速篩選器 -->
                <select id="filter-strategy" onchange="onSearchOrFilterChange()" 
                        class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">所有關注標的</option>
                    <option value="matchOnly">🌟 僅顯示符合黃金策略 (放量+背離)</option>
                    <option value="bottomDivOnly">📈 僅顯示有底背離 (周/月)</option>
                    <option value="volSpikeOnly">🔥 僅顯示放量異動 (成交量比 ≥ 2x)</option>
                </select>
            </div>

            <div class="text-xs text-gray-500">
                顯示 <span id="current-count" class="font-bold text-gray-700">0</span> 隻股票
            </div>
        </div>

        <!-- 資料表格 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase text-xs tracking-wider border-b border-gray-200 select-none">
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200" onclick="sortTable('ticker')">
                                股票代號 <i id="sort-ticker" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('price')">
                                現價 ($) <i id="sort-price" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('marketCapNum')">
                                市值 <i id="sort-marketCapNum" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 text-center">周線 MACD 背離</th>
                            <th class="py-3 px-4 text-center">月線 MACD 背離</th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('turnoverDiff')">
                                今日成交金額增幅 (%) <i id="sort-turnoverDiff" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('volumeRatio')">
                                成交量比 (今日/昨日) <i id="sort-volumeRatio" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 text-center">策略匹配</th>
                            <th class="py-3 px-4 text-center">快捷連結</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="divide-y divide-gray-100 text-sm">
                        <!-- 動態插入數據 -->
                    </tbody>
                </table>
            </div>

            <!-- 無資料提示 -->
            <div id="no-data" class="hidden text-center py-12 text-gray-400">
                <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
                <p class="text-sm">沒有找到符合條件的股票資料</p>
            </div>

            <!-- 分頁列 -->
            <div class="bg-gray-50 px-4 py-3 border-t border-gray-200 flex items-center justify-between">
                <div class="text-xs text-gray-500">
                    頁次 <span id="page-num" class="font-bold">1</span> / <span id="total-pages" class="font-bold">1</span>
                </div>
                <div class="flex space-x-2">
                    <button id="prev-btn" onclick="changePage(-1)" class="px-3 py-1 bg-white border border-gray-300 text-gray-600 rounded text-xs hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                        上一頁
                    </button>
                    <button id="next-btn" onclick="changePage(1)" class="px-3 py-1 bg-white border border-gray-300 text-gray-600 rounded text-xs hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                        下一頁
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript 腳本 -->
    <script>
        let rawData = [];
        let filteredData = [];
        let currentPage = 1;
        const pageSize = 20;

        let currentSortColumn = 'marketCapNum';
        let currentSortOrder = 'desc'; // 'asc' 或 'desc'

        // 頁面載入時抓取 JSON 資料
        window.addEventListener('DOMContentLoaded', () => {
            fetchStockData();
        });

        async function fetchStockData() {
            try {
                const response = await fetch('stocks_data.json');
                if (!response.ok) throw new Error('無法載入 JSON 資料');
                
                const data = await response.json();
                
                // 渲染統計資料
                document.getElementById('last-updated-time').innerText = data.stats.lastUpdated || '未知';
                document.getElementById('stat-total').innerText = data.stats.totalScanned?.toLocaleString() || '0';
                document.getElementById('stat-success').innerText = data.stats.successCount?.toLocaleString() || '0';
                document.getElementById('stat-matched').innerText = data.stats.matchedCount?.toLocaleString() || '0';
                
                rawData = data.stocks || [];
                
                // 計算符合策略的數量
                const strategyMatches = rawData.filter(s => s.matchStrategy).length;
                document.getElementById('stat-strategy').innerText = strategyMatches.toLocaleString();

                // 初始應用搜尋與篩選
                onSearchOrFilterChange();
            } catch (err) {
                console.error("載入數據錯誤:", err);
                document.getElementById('stock-table-body').innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center py-8 text-red-500 font-medium">
                            <i class="fa-solid fa-triangle-exclamation mr-2"></i>資料載入失敗，請檢查 stocks_data.json 是否正確生成。
                        </td>
                    </tr>
                `;
            }
        }

        // 處理篩選與搜尋
        function onSearchOrFilterChange() {
            const searchTxt = document.getElementById('search-input').value.trim().toUpperCase();
            const filterVal = document.getElementById('filter-strategy').value;

            filteredData = rawData.filter(item => {
                // 代號搜尋過濾
                const matchesSearch = item.ticker.toUpperCase().includes(searchTxt);
                
                // 策略類型過濾
                let matchesFilter = true;
                if (filterVal === 'matchOnly') {
                    matchesFilter = item.matchStrategy === true;
                } else if (filterVal === 'bottomDivOnly') {
                    matchesFilter = (item.weekDiv === '底背離' || item.monthDiv === '底背離');
                } else if (filterVal === 'volSpikeOnly') {
                    matchesFilter = item.volumeRatio >= 2.0;
                }

                return matchesSearch && matchesFilter;
            });

            // 執行排序
            sortData();

            // 重置頁數
            currentPage = 1;
            renderTable();
        }

        // 表格排序邏輯
        function sortTable(column) {
            if (currentSortColumn === column) {
                currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortColumn = column;
                currentSortOrder = (column === 'ticker') ? 'asc' : 'desc'; // 文字預設升冪，數字預設降冪
            }
            
            updateSortIcons();
            sortData();
            renderTable();
        }

        function sortData() {
            filteredData.sort((a, b) => {
                let valA = a[currentSortColumn];
                let valB = b[currentSortColumn];

                if (valA === undefined || valA === null) valA = (typeof valB === 'string') ? '' : -Infinity;
                if (valB === undefined || valB === null) valB = (typeof valA === 'string') ? '' : -Infinity;

                if (typeof valA === 'string') {
                    return currentSortOrder === 'asc' 
                        ? valA.localeCompare(valB) 
                        : valB.localeCompare(valA);
                } else {
                    return currentSortOrder === 'asc' ? valA - valB : valB - valA;
                }
            });
        }

        function updateSortIcons() {
            document.querySelectorAll('.sort-icon').forEach(icon => {
                icon.className = 'fa-solid fa-sort sort-icon';
            });

            const activeIcon = document.getElementById(`sort-${currentSortColumn}`);
            if (activeIcon) {
                activeIcon.className = `fa-solid fa-sort-${currentSortOrder === 'asc' ? 'up' : 'down'} sort-icon active-sort`;
            }
        }

        // 渲染表格資料
        function renderTable() {
            const tbody = document.getElementById('stock-table-body');
            const noData = document.getElementById('no-data');
            
            document.getElementById('current-count').innerText = filteredData.length;

            if (filteredData.length === 0) {
                tbody.innerHTML = '';
                noData.classList.remove('hidden');
                document.getElementById('page-num').innerText = '0';
                document.getElementById('total-pages').innerText = '0';
                document.getElementById('prev-btn').disabled = true;
                document.getElementById('next-btn').disabled = true;
                return;
            }

            noData.classList.add('hidden');

            const totalPages = Math.ceil(filteredData.length / pageSize);
            const startIdx = (currentPage - 1) * pageSize;
            const pageData = filteredData.slice(startIdx, startIdx + pageSize);

            tbody.innerHTML = pageData.map(stock => {
                // 背離標籤樣式
                const getDivTag = (div) => {
                    if (div === '底背離') return `<span class="bg-red-100 text-red-700 font-bold px-2.5 py-1 rounded-md text-xs">底背離</span>`;
                    if (div === '頂背離') return `<span class="bg-green-100 text-green-700 font-bold px-2.5 py-1 rounded-md text-xs">頂背離</span>`;
                    return `<span class="text-gray-400 text-xs">-</span>`;
                };

                // 成交金額增幅樣式
                const turnoverDiffClass = stock.turnoverDiff >= 0 ? 'text-red-600 font-semibold' : 'text-green-600 font-semibold';
                const turnoverDiffSign = stock.turnoverDiff >= 0 ? '+' : '';

                // 成交量比樣式
                const volRatioClass = stock.volumeRatio >= 2.0 ? 'text-red-600 font-bold bg-red-50 px-2 py-0.5 rounded' : 'text-gray-700';

                return `
                    <tr class="hover:bg-blue-50/50 transition-colors">
                        <td class="py-3.5 px-4 font-bold text-gray-900">${stock.ticker}</td>
                        <td class="py-3.5 px-4 text-right font-mono font-medium">${stock.price.toFixed(2)}</td>
                        <td class="py-3.5 px-4 text-right font-mono font-semibold text-gray-700">${stock.marketCap || 'N/A'}</td>
                        <td class="py-3.5 px-4 text-center">${getDivTag(stock.weekDiv)}</td>
                        <td class="py-3.5 px-4 text-center">${getDivTag(stock.monthDiv)}</td>
                        <td class="py-3.5 px-4 text-right font-mono ${turnoverDiffClass}">
                            ${turnoverDiffSign}${stock.turnoverDiff.toFixed(1)}%
                        </td>
                        <td class="py-3.5 px-4 text-right font-mono">
                            <span class="${volRatioClass}">${stock.volumeRatio.toFixed(2)}x</span>
                        </td>
                        <td class="py-3.5 px-4 text-center">
                            ${stock.matchStrategy 
                                ? `<span class="bg-purple-100 text-purple-800 text-xs px-2.5 py-1 rounded-full font-bold border border-purple-200">
                                     <i class="fa-solid fa-star text-amber-400 mr-1"></i>符合黃金策略
                                   </span>` 
                                : `<span class="text-gray-400 text-xs">-</span>`}
                        </td>
                        <td class="py-3.5 px-4 text-center">
                            <a href="${stock.futuUrl}" target="_blank" rel="noopener noreferrer" 
                               class="inline-flex items-center space-x-1 text-xs bg-orange-500 hover:bg-orange-600 text-white font-medium px-2.5 py-1 rounded transition-colors">
                                <span>富途行情</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </td>
                    </tr>
                `;
            }).join('');

            // 更新分頁按鈕狀態
            document.getElementById('page-num').innerText = currentPage;
            document.getElementById('total-pages').innerText = totalPages;
            document.getElementById('prev-btn').disabled = (currentPage === 1);
            document.getElementById('next-btn').disabled = (currentPage === totalPages);
        }

        // 分頁切換
        function changePage(delta) {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            currentPage += delta;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderTable();
        }
    </script>
</body>
</html>
