<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股盤整突破轉勢掃描器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sort-icon { font-size: 0.8rem; margin-left: 4px; color: #9ca3af; }
        .active-sort { color: #2563eb; }
        .btn-filter-active {
            background-color: #2563eb !important;
            color: #ffffff !important;
            border-color: #2563eb !important;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- 頂部導航 -->
    <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-arrows-spin text-blue-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">美股盤整突破轉勢掃描器</h1>
            </div>
            <div class="text-xs md:text-sm text-gray-400 mt-2 sm:mt-0">
                更新時間：<span id="last-updated-time" class="text-gray-200 font-mono">載入中...</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- 統計卡片 -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <span class="text-gray-500 text-xs font-semibold uppercase">掃描總數</span>
                <div class="text-2xl font-bold text-gray-800 mt-1" id="stat-total">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <span class="text-gray-500 text-xs font-semibold uppercase">成功解析</span>
                <div class="text-2xl font-bold text-emerald-600 mt-1" id="stat-success">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <span class="text-gray-500 text-xs font-semibold uppercase">🟢 底部轉勢</span>
                <div class="text-2xl font-bold text-emerald-600 mt-1" id="stat-bottom">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <span class="text-gray-500 text-xs font-semibold uppercase">🔴 頂部轉勢</span>
                <div class="text-2xl font-bold text-red-600 mt-1" id="stat-top">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <span class="text-gray-500 text-xs font-semibold uppercase">⭐ 有背離</span>
                <div class="text-2xl font-bold text-amber-600 mt-1" id="stat-div">0</div>
            </div>
        </div>

        <!-- 篩選列 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex flex-wrap gap-2" id="filter-btn-group">
                    <button onclick="setFilter('all', this)" class="filter-btn btn-filter-active px-3 py-1.5 rounded-lg text-xs font-semibold border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition">
                        全部
                    </button>
                    <button onclick="setFilter('bottomOnly', this)" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition">
                        🟢 底部轉勢
                    </button>
                    <button onclick="setFilter('topOnly', this)" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition">
                        🔴 頂部轉勢
                    </button>
                    <button onclick="setFilter('divOnly', this)" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition">
                        ⭐ 僅有背離
                    </button>
                </div>

                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="search-input" placeholder="搜尋代號 (如 NVDA)" 
                           class="w-full pl-9 pr-4 py-1.5 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"
                           oninput="onSearchOrFilterChange()">
                </div>
            </div>

            <div class="text-xs text-gray-500 flex justify-between items-center pt-2 border-t border-gray-100">
                <span>目前顯示：<strong id="current-count" class="text-gray-800">0</strong> 隻標的</span>
            </div>
        </div>

        <!-- 資料表格 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase text-xs tracking-wider border-b border-gray-200 select-none">
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200" onclick="sortTable('ticker')">
                                股票代號 <i id="sort-ticker" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('price')">
                                現價 ($) <i id="sort-price" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('marketCapNum')">
                                市值 <i id="sort-marketCapNum" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 text-center">類型</th>
                            <th class="py-3 px-4 text-center">背離</th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('fromHighPct')">
                                距 52W 高 <i id="sort-fromHighPct" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('fromLowPct')">
                                距 52W 低 <i id="sort-fromLowPct" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('consolidationRange')">
                                盤整波幅 <i id="sort-consolidationRange" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('volRatio')">
                                量比 <i id="sort-volRatio" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 text-center">連結</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="divide-y divide-gray-100 text-sm"></tbody>
                </table>
            </div>

            <div id="no-data" class="hidden text-center py-12 text-gray-400">
                <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
                <p class="text-sm">沒有找到符合條件的股票資料</p>
            </div>

            <div class="bg-gray-50 px-4 py-3 border-t border-gray-200 flex items-center justify-between">
                <div class="text-xs text-gray-500">
                    頁次 <span id="page-num" class="font-bold">1</span> / <span id="total-pages" class="font-bold">1</span>
                </div>
                <div class="flex space-x-2">
                    <button id="prev-btn" onclick="changePage(-1)" class="px-3 py-1 bg-white border border-gray-300 text-gray-600 rounded text-xs hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                        上一頁
                    </button>
                    <button id="next-btn" onclick="changePage(1)" class="px-3 py-1 bg-white border border-gray-300 text-gray-600 rounded text-xs hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                        下一頁
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        let rawData = [];
        let filteredData = [];
        let currentPage = 1;
        const pageSize = 20;

        let activeFilter = 'all';
        let currentSortColumn = 'volRatio';
        let currentSortOrder = 'desc';

        window.addEventListener('DOMContentLoaded', fetchStockData);

        async function fetchStockData() {
            try {
                const response = await fetch('stocks_data.json');
                if (!response.ok) throw new Error('無法載入');
                const data = await response.json();

                document.getElementById('last-updated-time').innerText = data.stats.lastUpdated || '未知';
                document.getElementById('stat-total').innerText = data.stats.totalScanned?.toLocaleString() || '0';
                document.getElementById('stat-success').innerText = data.stats.successCount?.toLocaleString() || '0';
                document.getElementById('stat-bottom').innerText = data.stats.bottomCount?.toLocaleString() || '0';
                document.getElementById('stat-top').innerText = data.stats.topCount?.toLocaleString() || '0';
                document.getElementById('stat-div').innerText = data.stats.divergenceCount?.toLocaleString() || '0';

                rawData = data.stocks || [];
                onSearchOrFilterChange();
            } catch (err) {
                console.error("載入錯誤:", err);
                document.getElementById('stock-table-body').innerHTML = `
                    <tr>
                        <td colspan="10" class="text-center py-8 text-red-500 font-medium">
                            <i class="fa-solid fa-triangle-exclamation mr-2"></i>資料載入失敗
                        </td>
                    </tr>
                `;
            }
        }

        function setFilter(filterType, element) {
            activeFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('btn-filter-active'));
            element.classList.add('btn-filter-active');
            onSearchOrFilterChange();
        }

        function onSearchOrFilterChange() {
            const searchTxt = document.getElementById('search-input').value.trim().toUpperCase();

            filteredData = rawData.filter(item => {
                const matchesSearch = item.ticker.toUpperCase().includes(searchTxt);
                let matchesFilter = true;
                if (activeFilter === 'bottomOnly') matchesFilter = (item.type === '底部轉勢');
                else if (activeFilter === 'topOnly') matchesFilter = (item.type === '頂部轉勢');
                else if (activeFilter === 'divOnly') matchesFilter = (item.hasDivergence === true);
                return matchesSearch && matchesFilter;
            });

            sortData();
            currentPage = 1;
            renderTable();
        }

        function sortTable(column) {
            if (currentSortColumn === column) {
                currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortColumn = column;
                currentSortOrder = (column === 'ticker') ? 'asc' : 'desc';
            }
            updateSortIcons();
            sortData();
            renderTable();
        }

        function sortData() {
            filteredData.sort((a, b) => {
                let valA = a[currentSortColumn];
                let valB = b[currentSortColumn];
                if (valA === undefined || valA === null) valA = (typeof valB === 'string') ? '' : -Infinity;
                if (valB === undefined || valB === null) valB = (typeof valA === 'string') ? '' : -Infinity;
                if (typeof valA === 'string') {
                    return currentSortOrder === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return currentSortOrder === 'asc' ? valA - valB : valB - valA;
            });
        }

        function updateSortIcons() {
            document.querySelectorAll('.sort-icon').forEach(icon => {
                icon.className = 'fa-solid fa-sort sort-icon';
            });
            const activeIcon = document.getElementById(`sort-${currentSortColumn}`);
            if (activeIcon) {
                activeIcon.className = `fa-solid fa-sort-${currentSortOrder === 'asc' ? 'up' : 'down'} sort-icon active-sort`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('stock-table-body');
            const noData = document.getElementById('no-data');
            document.getElementById('current-count').innerText = filteredData.length;

            if (filteredData.length === 0) {
                tbody.innerHTML = '';
                noData.classList.remove('hidden');
                document.getElementById('page-num').innerText = '0';
                document.getElementById('total-pages').innerText = '0';
                document.getElementById('prev-btn').disabled = true;
                document.getElementById('next-btn').disabled = true;
                return;
            }

            noData.classList.add('hidden');

            const totalPages = Math.ceil(filteredData.length / pageSize);
            const startIdx = (currentPage - 1) * pageSize;
            const pageData = filteredData.slice(startIdx, startIdx + pageSize);

            tbody.innerHTML = pageData.map(stock => {
                const typeTag = stock.type === '底部轉勢'
                    ? `<span class="bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded text-xs">🟢 底部</span>`
                    : `<span class="bg-red-100 text-red-700 font-bold px-2 py-0.5 rounded text-xs">🔴 頂部</span>`;

                const divTag = stock.hasDivergence
                    ? `<span class="text-amber-500 text-lg" title="有背離">⭐</span>`
                    : `<span class="text-gray-300 text-xs">-</span>`;

                const fromHighClass = stock.fromHighPct <= -30 ? 'text-red-600 font-semibold' : 'text-gray-700';
                const fromLowClass = stock.fromLowPct >= 50 ? 'text-emerald-600 font-semibold' : 'text-gray-700';
                const volRatioClass = stock.volRatio >= 2.0 ? 'text-red-600 font-bold bg-red-50 px-2 py-0.5 rounded' : 'text-gray-700';

                return `
                    <tr class="hover:bg-blue-50/50 transition-colors">
                        <td class="py-3.5 px-4 font-bold text-gray-900">${stock.ticker}</td>
                        <td class="py-3.5 px-4 text-right font-mono font-medium">${stock.price.toFixed(2)}</td>
                        <td class="py-3.5 px-4 text-right font-mono font-semibold text-gray-700">${stock.marketCap || 'N/A'}</td>
                        <td class="py-3.5 px-4 text-center">${typeTag}</td>
                        <td class="py-3.5 px-4 text-center">${divTag}</td>
                        <td class="py-3.5 px-4 text-right font-mono ${fromHighClass}">${stock.fromHighPct.toFixed(1)}%</td>
                        <td class="py-3.5 px-4 text-right font-mono ${fromLowClass}">+${stock.fromLowPct.toFixed(1)}%</td>
                        <td class="py-3.5 px-4 text-right font-mono text-gray-700">${stock.consolidationRange.toFixed(1)}%</td>
                        <td class="py-3.5 px-4 text-right font-mono">
                            <span class="${volRatioClass}">${stock.volRatio.toFixed(2)}x</span>
                        </td>
                        <td class="py-3.5 px-4 text-center space-x-1">
                            <a href="${stock.futuUrl}" target="_blank" rel="noopener noreferrer" 
                               class="inline-flex items-center space-x-1 text-xs bg-orange-500 hover:bg-orange-600 text-white font-medium px-2 py-1 rounded transition-colors">
                                <span>富途</span>
                            </a>
                            <a href="${stock.tvUrl}" target="_blank" rel="noopener noreferrer" 
                               class="inline-flex items-center space-x-1 text-xs bg-blue-500 hover:bg-blue-600 text-white font-medium px-2 py-1 rounded transition-colors">
                                <span>TV</span>
                            </a>
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('page-num').innerText = currentPage;
            document.getElementById('total-pages').innerText = totalPages;
            document.getElementById('prev-btn').disabled = (currentPage === 1);
            document.getElementById('next-btn').disabled = (currentPage === totalPages);
        }

        function changePage(delta) {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            currentPage += delta;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderTable();
        }
    </script>
</body>
</html>
