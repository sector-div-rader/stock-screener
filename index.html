<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股技術面與量能篩選器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .badge-divergence-bottom { background-color: #d1fae5; color: #047857; border: 1px solid #a7f3d0; }
        .badge-divergence-top { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .badge-none { background-color: #f3f4f6; color: #6b7280; }
        .sort-icon { font-size: 0.75rem; margin-left: 0.25rem; color: #9ca3af; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- 頁頭資訊 -->
        <header class="mb-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b pb-4 bg-white p-4 rounded-xl shadow-sm">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-blue-600"></i> 美股技術面與爆量篩選器
                </h1>
                <p class="text-sm text-gray-500 mt-1">追蹤 MACD DIF 背離型態 (週/月) 與日線量能爆發條件</p>
            </div>
            <div class="text-xs text-gray-400 self-start md:self-end">
                最後更新時間: <span id="lastUpdated" class="font-medium text-gray-600">--</span>
            </div>
        </header>

        <!-- 掃描數據統計卡片 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="text-xs text-gray-500">總掃描股票數</div>
                <div id="statTotal" class="text-xl font-bold text-gray-800 mt-1">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="text-xs text-green-600 font-medium">測試成功</div>
                <div id="statSuccess" class="text-xl font-bold text-green-600 mt-1">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="text-xs text-red-500 font-medium">測試失敗/無數據</div>
                <div id="statFailed" class="text-xl font-bold text-red-500 mt-1">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="text-xs text-blue-600 font-medium">符合特徵/策略總數</div>
                <div id="statMatched" class="text-xl font-bold text-blue-600 mt-1">0</div>
            </div>
        </div>

        <!-- 篩選與工具列 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col lg:flex-row gap-4 justify-between items-start lg:items-center">
            <div class="flex flex-wrap gap-3 items-center w-full lg:w-auto">
                <!-- 搜尋 -->
                <div class="relative min-w-[180px]">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="搜尋代號..." 
                        class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- 快捷按鈕：底背離 / 頂背離 -->
                <div class="flex items-center bg-gray-100 p-1 rounded-lg border border-gray-200">
                    <button id="btnAllDiv" onclick="setDivFilter('ALL')" class="px-3 py-1.5 text-xs font-medium rounded-md bg-white text-gray-800 shadow-sm transition">全部背離</button>
                    <button id="btnBottomDiv" onclick="setDivFilter('BOTTOM')" class="px-3 py-1.5 text-xs font-medium rounded-md text-emerald-700 hover:bg-emerald-50 transition">🟢 僅看底背離</button>
                    <button id="btnTopDiv" onclick="setDivFilter('TOP')" class="px-3 py-1.5 text-xs font-medium rounded-md text-red-700 hover:bg-red-50 transition">🔴 僅看頂背離</button>
                </div>

                <!-- 僅看量能爆發 -->
                <label class="inline-flex items-center cursor-pointer text-sm font-medium text-gray-700 bg-gray-100 px-3 py-2 rounded-lg border hover:bg-gray-200 transition">
                    <input type="checkbox" id="volumeFilter" class="sr-only peer">
                    <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600 relative"></div>
                    <span class="ml-2 text-xs">僅看「量能爆發」</span>
                </label>
            </div>

            <div class="text-xs text-gray-500 flex items-center gap-1 self-end lg:self-center">
                顯示 <span id="recordCount" class="font-bold text-gray-800">0</span> 筆數據
            </div>
        </div>

        <!-- 數據表格 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-100 text-gray-600 font-semibold border-b border-gray-200 select-none">
                        <tr>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200" onclick="sortTable('ticker')">
                                代號 (連結至富途) <i id="sort-ticker" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('price')">
                                現價 (USD) <i id="sort-price" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 text-center">週線 MACD 背離</th>
                            <th class="py-3 px-4 text-center">月線 MACD 背離</th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('turnoverDiff')">
                                日換手率 (較昨日) <i id="sort-turnoverDiff" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-200 text-right" onclick="sortTable('volumeRatio')">
                                日成交量 (較昨日倍數) <i id="sort-volumeRatio" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th class="py-3 px-4 text-center">策略符合度</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-200 text-gray-700">
                        <tr>
                            <td colspan="7" class="py-8 text-center text-gray-400">
                                <i class="fa-solid fa-spinner fa-spin mr-2"></i>正在載入最新數據...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let stockData = [];
        let currentData = [];
        let activeDivMode = 'ALL';
        let currentSortColumn = '';
        let isAscending = true;

        async function loadStockData() {
            try {
                const response = await fetch('./stocks_data.json?t=' + new Date().getTime());
                if (response.ok) {
                    const rawData = await response.json();
                    
                    // 填入數據統計
                    if (rawData.stats) {
                        document.getElementById('statTotal').innerText = rawData.stats.totalScanned || 0;
                        document.getElementById('statSuccess').innerText = rawData.stats.successCount || 0;
                        document.getElementById('statFailed').innerText = rawData.stats.failedCount || 0;
                        document.getElementById('statMatched').innerText = rawData.stats.matchedCount || 0;
                        document.getElementById('lastUpdated').innerText = rawData.stats.lastUpdated || '--';
                        stockData = rawData.stocks || [];
                    } else {
                        stockData = Array.isArray(rawData) ? rawData : [];
                    }

                    currentData = [...stockData];
                    renderTable(currentData);
                } else {
                    showErrorMessage("找不到 stocks_data.json，請確認 Python 腳本是否已執行。");
                }
            } catch (error) {
                console.error("載入失敗:", error);
                showErrorMessage("數據載入失敗。");
            }
        }

        function showErrorMessage(msg) {
            document.getElementById('tableBody').innerHTML = `
                <tr><td colspan="7" class="py-8 text-center text-red-500 font-medium"><i class="fa-solid fa-triangle-exclamation mr-2"></i>${msg}</td></tr>`;
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-gray-400">沒有符合條件的股票標的</td></tr>`;
                document.getElementById('recordCount').innerText = 0;
                return;
            }

            // 判斷是否為手機/平板行動裝置
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            data.forEach(stock => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";

                const weekBadge = getDivergenceBadge(stock.weekDiv);
                const monthBadge = getDivergenceBadge(stock.monthDiv);

                const turnoverClass = stock.turnoverDiff >= 20 ? "text-green-600 font-bold" : "text-gray-600";
                const volumeClass = stock.volumeRatio >= 2.0 ? "text-green-600 font-bold bg-green-50 px-2 py-1 rounded border border-green-200 inline-block" : "text-gray-600";

                // 手機跳轉至網頁/App，電腦喚起富途桌面 Client 程式
                const futuLink = isMobile 
                    ? `https://www.futunn.com/hk/stock/${stock.ticker}-US`
                    : `futunn://quote/us/${stock.ticker}`;

                tr.innerHTML = `
                    <td class="py-3 px-4">
                        <a href="${futuLink}" target="_blank" rel="noopener noreferrer" class="font-bold text-blue-600 hover:text-blue-800 hover:underline inline-flex items-center gap-1">
                            ${stock.ticker} <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </td>
                    <td class="py-3 px-4 text-right font-medium">$${Number(stock.price).toFixed(2)}</td>
                    <td class="py-3 px-4 text-center">${weekBadge}</td>
                    <td class="py-3 px-4 text-center">${monthBadge}</td>
                    <td class="py-3 px-4 text-right">
                        <div>${stock.turnover}</div>
                        <div class="text-xs ${turnoverClass}">較昨日 ${stock.turnoverDiff >= 0 ? '+' : ''}${Number(stock.turnoverDiff).toFixed(1)}%</div>
                    </td>
                    <td class="py-3 px-4 text-right">
                        <span class="${volumeClass}">${Number(stock.volumeRatio).toFixed(1)} 倍</span>
                    </td>
                    <td class="py-3 px-4 text-center">
                        ${stock.matchStrategy ? 
                            '<span class="inline-flex items-center gap-1 text-xs font-bold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full"><i class="fa-solid fa-check"></i> 符合完全條件</span>' : 
                            '<span class="text-xs text-gray-400">未完全符合</span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('recordCount').innerText = data.length;
        }

        function getDivergenceBadge(type) {
            if (type === "底背離") return `<span class="badge-divergence-bottom px-2.5 py-0.5 rounded text-xs font-semibold"><i class="fa-solid fa-arrow-trend-up mr-1"></i>底背離</span>`;
            if (type === "頂背離") return `<span class="badge-divergence-top px-2.5 py-0.5 rounded text-xs font-semibold"><i class="fa-solid fa-arrow-trend-down mr-1"></i>頂背離</span>`;
            return `<span class="badge-none px-2.5 py-0.5 rounded text-xs">無背離</span>`;
        }

        function setDivFilter(mode) {
            activeDivMode = mode;
            
            const btnAll = document.getElementById('btnAllDiv');
            const btnBottom = document.getElementById('btnBottomDiv');
            const btnTop = document.getElementById('btnTopDiv');

            btnAll.className = "px-3 py-1.5 text-xs font-medium rounded-md transition " + (mode === 'ALL' ? "bg-white text-gray-800 shadow-sm" : "text-gray-600 hover:bg-gray-200");
            btnBottom.className = "px-3 py-1.5 text-xs font-medium rounded-md transition " + (mode === 'BOTTOM' ? "bg-emerald-600 text-white shadow-sm" : "text-emerald-700 hover:bg-emerald-50");
            btnTop.className = "px-3 py-1.5 text-xs font-medium rounded-md transition " + (mode === 'TOP' ? "bg-red-600 text-white shadow-sm" : "text-red-700 hover:bg-red-50");

            filterData();
        }

        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const volOnly = document.getElementById('volumeFilter').checked;

            currentData = stockData.filter(stock => {
                const matchSearch = stock.ticker.toLowerCase().includes(search);
                
                let matchDiv = true;
                if (activeDivMode === "BOTTOM") {
                    matchDiv = (stock.weekDiv === "底背離" || stock.monthDiv === "底背離");
                } else if (activeDivMode === "TOP") {
                    matchDiv = (stock.weekDiv === "頂背離" || stock.monthDiv === "頂背離");
                }

                let matchVol = true;
                if (volOnly) {
                    matchVol = stock.turnoverDiff >= 20 && stock.volumeRatio >= 2.0;
                }

                return matchSearch && matchDiv && matchVol;
            });

            renderTable(currentData);
        }

        function sortTable(column) {
            if (currentSortColumn === column) {
                isAscending = !isAscending;
            } else {
                currentSortColumn = column;
                isAscending = true;
            }

            currentData.sort((a, b) => {
                let valA = a[column];
                let valB = b[column];

                if (typeof valA === 'string') {
                    return isAscending ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return isAscending ? valA - valB : valB - valA;
            });

            renderTable(currentData);
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('volumeFilter').addEventListener('change', filterData);

        loadStockData();
    </script>
</body>
</html>
