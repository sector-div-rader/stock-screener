name: 自動計算美股指標

on:
  schedule:
    # 每天美股收盤後（約香港時間早上 6:00）自動執行一次
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # 允許你手動按按鈕隨時執行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: 執行選股策略計算
        run: python main.py

      - name: 自動提交並更新 JSON 數據
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks_data.json
          git commit -m "更新美股篩選數據 [skip ci]" || exit 0
          git push
