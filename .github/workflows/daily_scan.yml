name: 自動計算美股指標

on:
  schedule:
    # 每天美股收盤後（約香港時間早上 6:00）自動執行一次
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # 允許你手動按按鈕隨時執行

# 關鍵修復：給予 Actions 寫入 Git 倉庫的權限，否則 git push 會被拒絕
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4
      - name: 診斷
        run: python diag.py
      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
             python -m pip install --upgrade pip
             pip install pandas numpy yfinance requests scipy

      - name: 執行選股策略計算
        run: python main.py

      - name: 自動提交並更新 JSON 數據
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks_data.json
          git diff --staged --quiet || (git commit -m "更新美股篩選數據 [skip ci]" && git push)
